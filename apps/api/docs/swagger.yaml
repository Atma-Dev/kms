  space.UpdateSpaceRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      icon:
        maxLength: 64
        type: string
      is_archived:
        type: boolean
      name:
        maxLength: 255
        type: string
    required:
    - name
    type: object
  tag.StoreTagRequest:
    properties:
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  tag.SyncDocumentTagsRequest:
    properties:
      names:
        items:
          type: string
        type: array
    type: object
  tag.TagResource:
    properties:
      created_at:
        type: string
      document_count:
        description: |-
          DocumentCount is only filled by the master list — the tag chips on a
          document have no use for it, and counting on every read would cost a
          join the document page never needs.
        type: integer
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  tag.UpdateTagRequest:
    properties:
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  user.Resource:
    properties:
      created_at:
        type: string
      deactivated_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      full_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      marketing_id:
        type: string
      membership_status:
        description: Whether the account is allowed in at all.
        type: string
      permissions:
        description: |-
          Flattened across every role, deduped. Requires Roles.Permissions to be
          preloaded (AuthMiddleware does this) — nil otherwise, same as Roles
          would be empty.
        items:
          type: string
        type: array
      roles:
        items:
          properties:
            id:
              type: string
            name:
              type: string
          type: object
        type: array
    type: object
  user.UpdatePasswordRequest:
    properties:
      current_password:
        type: string
      password:
        minLength: 8
        type: string
      password_confirmation:
        description: |-
          eqfield keeps the "typed it twice" check server-side too — the SPA does
          it as well, but a mismatched pair reaching here would silently set the
          password to whichever field the API happened to read.
        type: string
    required:
    - current_password
    - password
    - password_confirmation
    type: object
  user.UpdateRequest:
    properties:
      marketing_id:
        type: string
      role_ids:
        items:
          type: string
        type: array
    type: object
