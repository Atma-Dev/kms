          $ref: '#/definitions/category.StoreCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/category.CategoryResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - categories
  /spaces/{spaceId}/categories/order:
    patch:
      consumes:
      - application/json
      description: Takes the whole ordered sibling list; positions are renumbered
        0..n-1 in one transaction. A partial list is refused with 422.
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Ordered sibling ids
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/category.ReorderCategoriesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/category.CategoryResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Reorder one level of a space's category tree
      tags:
      - categories
  /spaces/{spaceId}/documents:
    get:
      description: Pinned documents sort first whatever the chosen order. `search`
        matches title and excerpt only — full-text search over the content is Modul
        3.
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Rows per page
        in: query
        name: per_page
        type: integer
      - description: Filter by status
        enum:
        - draft
        - in_review
        - published
        - archived
        in: query
        name: status
        type: string
      - description: Filter by category
        in: query
        name: category_id
        type: string
      - description: Filter by author
        in: query
        name: author_id
        type: string
      - description: Match on title or excerpt
        in: query
        name: search
        type: string
      - description: Sort column
        enum:
        - updated_at
        - view_count
        - title
        - created_at
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/document.DocumentResource'
                      type: array
                    meta:
                      $ref: '#/definitions/utils.PaginationMeta'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List documents in a space
      tags:
      - documents
    post:
      consumes:
      - application/json
      description: Always starts as a draft — publishing is a separate act with its
        own permission, never a field on the create form.
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Document
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.StoreDocumentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Create a draft
      tags:
      - documents
  /spaces/{spaceId}/documents/deleted:
    get:
      description: The bin. Gated on documents.destroy, which is strictly more than
        reading — and restricted documents are not filtered out, or one could never
        be restored by anyone.
      parameters:
      - description: Space ID
        in: path
        name: spaceId
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Rows per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/document.DocumentResource'
                      type: array
                    meta:
                      $ref: '#/definitions/utils.PaginationMeta'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List a space's deleted documents
      tags:
      - documents
  /tags:
    get:
      description: The whole vocabulary with how many documents each tag labels, so
        deleting one shows what it would take with it.
      parameters:
      - description: Match on name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/tag.TagResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List tags
      tags:
      - tags
    post:
      consumes:
      - application/json
      description: Answers with the existing tag when the name is already taken —
        the caller wanted it to exist, and it does.
      parameters:
      - description: Tag
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tag.StoreTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/tag.TagResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Create a tag
      tags:
      - tags
  /tags/{id}:
    delete:
      description: Removes the label from every document that carried it.
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Delete a tag
      tags:
      - tags
    put:
      consumes:
      - application/json
      description: Relabels every document already carrying it. A rename onto a name
        that already exists is refused rather than merged — merging folds one vocabulary
        entry into another across every document using it, with no undo.
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      - description: New name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tag.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/tag.TagResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Rename a tag
      tags:
      - tags
  /uploads/inline-image:
    post:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data, fields `file` and `space_id`. Returns a URL
        for the editor to embed. Separate from attachments: the answer is a URL, not
        a row in the file list, and the limits are tighter (FR-8).'
      parameters:
      - description: Space ID the image is filed under
        in: formData
        name: space_id
        required: true
        type: string
      - description: Image (jpg, png, webp, gif)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/attachment.InlineImageResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Upload an image to embed in a document's content
      tags:
      - attachments
securityDefinitions:
  BearerAuth:
    description: Go JWT access token, as "Bearer <token>". Obtained from /auth/login,
      the Google flow (/auth/google/redirect), or, in local dev, /auth/dev-login.
    in: header
    name: Authorization
    type: apiKey
  M2MClientID:
    description: Machine-to-machine client id (m2m_clients.id, the row's uuid — not
      its display name), paired with X-Client-Secret.
    in: header
    name: X-Client-Id
    type: apiKey
  M2MClientSecret:
    description: Machine-to-machine client secret, paired with X-Client-Id.
    in: header
    name: X-Client-Secret
    type: apiKey
swagger: "2.0"
