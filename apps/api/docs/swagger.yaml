      finished_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      max_attempts:
        type: integer
      name:
        type: string
      payload:
        items:
          type: integer
        type: array
      payload_redacted:
        type: boolean
      queue:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/queue.Status'
    type: object
  queue.RetryFailedRequest:
    properties:
      name:
        maxLength: 100
        type: string
    type: object
  queue.Stats:
    properties:
      by_name:
        items:
          $ref: '#/definitions/queue.NameCount'
        type: array
      by_queue:
        items:
          $ref: '#/definitions/queue.QueueCount'
        type: array
      by_status:
        additionalProperties:
          format: int64
          type: integer
        type: object
      delayed_count:
        type: integer
      oldest_pending_age_seconds:
        type: integer
      queues:
        items:
          type: string
        type: array
      registered_jobs:
        items:
          type: string
        type: array
    type: object
  queue.Status:
    enum:
    - pending
    - running
    - success
    - failed
    - canceled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusSuccess
    - StatusFailed
    - StatusCanceled
  rbac.PermissionResource:
    properties:
      created_at:
        type: string
      description:
        type: string
      feature_group:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  rbac.RoleResource:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_mutable:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/rbac.PermissionResource'
        type: array
      updated_at:
        type: string
    type: object
  rbac.StoreRoleRequest:
    properties:
      name:
        type: string
