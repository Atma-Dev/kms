basePath: /api
definitions:
  activitylog.Resource:
    properties:
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      method:
        type: string
      path:
        type: string
      request_body:
        type: string
      response_body:
        type: string
      status_code:
        type: integer
      updated_at:
        type: string
      user:
        $ref: '#/definitions/user.Resource'
    type: object
  attachment.AttachmentResource:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      id:
        type: string
      uploaded_by:
        type: string
      url:
        description: |-
          URL is the only way to reach the bytes. file_path is never serialised:
          the store is not a static mount, and a path would suggest it is.
        type: string
    type: object
  attachment.InlineImageResource:
    properties:
      url:
        type: string
    type: object
  audit.Resource:
    properties:
      action:
        type: string
      actor_email:
        type: string
      actor_id:
        type: string
      actor_name:
        type: string
      actor_phone:
        type: string
      actor_table:
        type: string
      additional:
        items:
          type: integer
        type: array
      app_name:
        type: string
      created_at:
        type: string
      endpoint:
        type: string
      entry_object_id:
        type: string
      entry_object_table:
        type: string
      id:
        type: string
      ip_address:
        type: string
      message:
        type: string
      method:
        type: string
      tag:
        items:
          type: integer
        type: array
      trails:
        items:
          $ref: '#/definitions/audit.TrailResource'
        type: array
      user_agent:
        type: string
    type: object
  audit.TrailResource:
    properties:
      additional:
        items:
          type: integer
        type: array
      after:
        items:
          type: integer
        type: array
      before:
        items:
          type: integer
        type: array
      id:
        type: string
      object_id:
        type: string
      object_table:
        type: string
      tag:
        items:
          type: integer
        type: array
    type: object
  auth.AuthenticateResource:
    properties:
      active_company_id: {}
      email:
        type: string
      first_name:
        type: string
      full_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      roles:
        items: {}
        type: array
      tokens:
        properties:
          access_token:
            type: string
          refresh_token:
            type: string
        type: object
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  category.CategoryResource:
    properties:
      children:
        items:
          $ref: '#/definitions/category.CategoryResource'
        type: array
      created_at:
        type: string
      document_count:
        description: |-
          DocumentCount includes everything in the subtree, because that is what
          clicking this category lists. Zero on the plain create/update responses,
          which do not count — only the tree endpoint fills it.
        type: integer
      id:
        type: string
      name:
        type: string
      order:
        type: integer
      parent_id:
        type: string
      slug:
        type: string
      space_id:
        type: string
      updated_at:
        type: string
    type: object
  category.CategoryTreeResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/category.CategoryResource'
        type: array
      total_document_count:
        description: TotalDocumentCount backs the "all documents" row above the tree.
        type: integer
      uncategorised_count:
        description: |-
          UncategorisedCount is documents with no category. They are reachable
          through "all documents" and nowhere else, so the number is worth showing
          rather than leaving them to be discovered by subtraction.
        type: integer
    type: object
  category.ReorderCategoriesRequest:
    properties:
      ids:
        items:
          type: string
        minItems: 1
        type: array
      parent_id:
        type: string
    required:
    - ids
    type: object
  category.StoreCategoryRequest:
    properties:
      name:
        maxLength: 255
        type: string
      parent_id:
        type: string
    required:
    - name
    type: object
  category.UpdateCategoryRequest:
    properties:
      name:
        maxLength: 255
        type: string
      parent_id:
        type: string
    required:
    - name
    type: object
  document.AccessLevel:
    enum:
    - view
    - edit
    - manage
    type: string
    x-enum-varnames:
    - AccessView
    - AccessEdit
    - AccessManage
  document.AccessResource:
    properties:
      created_at:
        type: string
      id:
        type: string
      permission:
        $ref: '#/definitions/document.AccessLevel'
      subject_id:
        type: string
      subject_type:
        $ref: '#/definitions/document.SubjectType'
    type: object
  document.Action:
    enum:
    - submit-review
    - approve
    - reject
    - publish
    - unpublish
    - archive
    - restore
    type: string
    x-enum-varnames:
    - ActionSubmitReview
    - ActionApprove
    - ActionReject
    - ActionPublish
    - ActionUnpublish
    - ActionArchive
    - ActionRestore
  document.DiffLine:
    properties:
      from_line:
        description: |-
          FromLine / ToLine are 1-based, and nil on the side the line is absent
          from.
        type: integer
      op:
        $ref: '#/definitions/document.Op'
      text:
        type: string
      to_line:
        type: integer
    type: object
  document.DocumentDetailResource:
    properties:
      author_id:
        type: string
      available_actions:
        description: |-
          AvailableActions is what this caller may do to this document right now —
          the legal transitions from its status, filtered by what they hold. The
          client renders exactly these buttons instead of re-deriving the rules
          and drifting from them.
        items:
          $ref: '#/definitions/document.Action'
        type: array
      can_edit:
        type: boolean
      category_id:
        type: string
      content:
        items:
          type: integer
        type: array
      created_at:
        type: string
      current_version_id:
        type: string
      excerpt:
        type: string
      id:
        type: string
      is_pinned:
        type: boolean
      is_restricted:
        description: |-
          IsRestricted says the document carries access grants, so the reader is
          looking at it because they are named on it. The client shows a lock; it
          never has to work out who is on the list, which is gated separately.
        type: boolean
      last_editor_id:
        type: string
      published_at:
        type: string
      slug:
        type: string
      space_id:
        type: string
      status:
        $ref: '#/definitions/document.Status'
      tags:
        items:
          $ref: '#/definitions/tag.TagResource'
        type: array
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  document.DocumentResource:
    properties:
      author_id:
        type: string
      category_id:
        type: string
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: string
      is_pinned:
        type: boolean
      published_at:
        type: string
      slug:
        type: string
      space_id:
        type: string
      status:
        $ref: '#/definitions/document.Status'
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  document.Op:
    enum:
    - equal
    - add
    - remove
    type: string
    x-enum-varnames:
    - OpEqual
    - OpAdd
    - OpRemove
  document.PinDocumentRequest:
    properties:
      is_pinned:
        type: boolean
    required:
    - is_pinned
    type: object
  document.RollbackRequest:
    properties:
      change_note:
        maxLength: 500
        type: string
    type: object
  document.Status:
    enum:
    - draft
    - in_review
    - published
    - archived
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusInReview
    - StatusPublished
    - StatusArchived
  document.StoreAccessRequest:
    properties:
      permission:
        allOf:
        - $ref: '#/definitions/document.AccessLevel'
        enum:
        - view
        - edit
        - manage
      subject_id:
        type: string
      subject_type:
        allOf:
        - $ref: '#/definitions/document.SubjectType'
        enum:
        - user
        - role
    required:
    - permission
    - subject_id
    - subject_type
    type: object
  document.StoreDocumentRequest:
    properties:
      category_id:
        type: string
      content:
        items:
          type: integer
        type: array
      title:
        maxLength: 255
        type: string
    required:
    - content
    - title
    type: object
  document.SubjectType:
    enum:
    - user
    - role
    type: string
    x-enum-varnames:
    - SubjectUser
    - SubjectRole
  document.TransitionRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    type: object
  document.UpdateDocumentRequest:
    properties:
      category_id:
        type: string
      change_note:
        maxLength: 500
        type: string
      content:
        items:
          type: integer
        type: array
      is_pinned:
        type: boolean
      title:
        maxLength: 255
        type: string
    required:
    - content
    - title
    type: object
  document.VersionDetailResource:
    properties:
      change_note:
        type: string
      content:
        items:
          type: integer
        type: array
      created_at:
        type: string
      editor_id:
        type: string
      id:
        type: string
      version_number:
        type: integer
    type: object
  document.VersionResource:
    properties:
      change_note:
        type: string
      created_at:
        type: string
      editor_id:
        type: string
      id:
        type: string
      version_number:
        type: integer
    type: object
  enums.ResponseCode:
    enum:
    - SUCCESS
    - CREATED
    - ERR_NOT_FOUND
    - ERR_ROUTE_NOT_FOUND
    - ERR_ACTION_UNAUTHORIZED
    - ERR_INVALID_ACTION
    - ERR_INVALID_STATUS
    - ERR_AUTHENTICATION
    - ERR_INVALID_QUERY_PARAMETER
    - ERR_INTERNAL_SERVER_ERROR
    - ERR_BAD_REQUEST
    type: string
    x-enum-varnames:
    - SUCCESS
    - CREATED
    - ERR_NOT_FOUND
    - ERR_ROUTE_NOT_FOUND
    - ERR_ACTION_UNAUTHORIZED
    - ERR_INVALID_ACTION
    - ERR_INVALID_STATUS
    - ERR_AUTHENTICATION
    - ERR_INVALID_QUERY_PARAMETER
    - ERR_INTERNAL_SERVER_ERROR
    - ERR_BAD_REQUEST
  joblog.Definition:
