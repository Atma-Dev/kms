      permission_ids:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  scheduler.Resource:
    properties:
      cron_expression:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_duration_ms:
        type: integer
      last_message:
        type: string
      last_run_at:
        type: string
      last_status:
        type: string
      name:
        type: string
      next_run_at:
        type: string
    type: object
  scheduler.UpdateScheduleRequest:
    properties:
      cron_expression:
        maxLength: 100
        type: string
      enabled:
        type: boolean
    required:
    - cron_expression
    type: object
  search.HistoryResource:
    properties:
      id:
        type: string
      query:
        type: string
      searched_at:
        description: |-
          SearchedAt is updated_at under a name that says what it means here: the
          last time this query was run, which is what the list is ordered by.
        type: string
    type: object
  search.ResultResource:
    properties:
      author_id:
        type: string
      category_id:
        type: string
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: string
      is_pinned:
        type: boolean
      published_at:
        type: string
      slug:
        type: string
      snippet:
        type: string
      space_id:
        type: string
      status:
        $ref: '#/definitions/document.Status'
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  search.SuggestionResource:
    properties:
      id:
        type: string
      slug:
        type: string
      space_id:
        type: string
      title:
