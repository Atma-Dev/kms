      from:
        type: integer
      last_page:
        type: integer
      path:
        type: string
      per_page:
        type: integer
      to:
        type: integer
      total:
        type: integer
    type: object
  utils.Payload:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/utils.PaginationMeta'
    type: object
info:
  contact: {}
  description: Atma KMS API. Owns its accounts (email + password, with Google login
    as an alternative), issues and validates its own JWT, and serves the RBAC and
    operational resources behind them.
  title: Atma KMS API
  version: "1.0"
paths:
  /attachments/{id}:
    delete:
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Delete an attachment
      tags:
      - attachments
  /attachments/{id}/download:
    get:
      description: Streams the file after checking the caller may see the document
        it belongs to. The store is deliberately not a static folder — a static mount
        would hand every file to anyone who guessed a path, and FR-9's restricted
        documents would be restricted in name only.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Download an attachment
      tags:
      - attachments
  /auth/dev-login:
    get:
      description: Issues a token pair for the given email with no password. Only
        enabled when APP_ENV=local; returns 404 otherwise.
      parameters:
      - description: User email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "404":
          description: not local env, or user not found
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
      summary: Dev-only login bypass
      tags:
      - auth
  /auth/google/callback:
    get:
      description: 'Backend-only callback: exchanges the authorization code for a
        Google token, resolves the local user by email, issues a Go JWT pair, and
        redirects to FRONTEND_URL/auth/callback with the access token (or an error
        reason). Never creates a user, and a Google account only ever proves an email
        — it does not itself grant access. See completeLogin.'
      parameters:
      - description: authorization code from Google
        in: query
        name: code
        required: true
        type: string
      - description: state from GoogleRedirect, echoed back by Google
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: redirect to FRONTEND_URL/auth/callback
          schema:
            type: string
      summary: Google login callback
      tags:
      - auth
  /auth/google/redirect:
    get:
      description: Redirects the browser to Google's consent screen. This is a confidential
        client (client secret, no PKCE) — the standard server-side "Sign in with Google"
        flow.
      responses:
        "302":
          description: redirect to Google
          schema:
            type: string
      summary: Start Google login
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Issues a JWT pair for a local account. For a web client both tokens
        also land in httpOnly cookies (access_token_verifier + refresh_token); a non-web
        client gets the refresh token in the body instead. A wrong email and a wrong
        password return the same 401 on purpose — telling them apart would let anyone
        enumerate registered addresses.
      parameters:
      - description: Credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      properties:
                        access_token:
                          type: string
                        refresh_token:
                          type: string
                      type: object
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the caller's current access token (and its paired refresh
        token) via the JWT blacklist.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates the access/refresh token pair. Web clients send the refresh
        token via the httpOnly `refresh_token` cookie; mobile clients send it as a
        Bearer token instead (no cookie jar).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/auth.AuthenticateResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Refresh access token
      tags:
      - auth
  /auth/ws-token:
    post:
      description: Issues a short-lived token scoped to WebSocket routes only (/notifications/ws,
        /management/audits/ws) — it carries no cookie requirement, so it does not
        depend on access_token_verifier crossing a different subdomain during the
        WS handshake, which browsers do not reliably do. AuthMiddleware refuses this
        token on every other route; it is otherwise usable nowhere else. Requires
        the same auth as any protected route (Bearer + access_token_verifier cookie
        for web clients).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      properties:
                        access_token:
                          type: string
                      type: object
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Issue a WebSocket-only access token
      tags:
      - auth
  /categories/{id}:
    delete:
      description: Its subtree goes with it. Documents filed under it are kept and
        left uncategorised — a document outlives the shelf it was on.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: 'A full replace: an absent parent_id makes it a root category.
        Moving it puts it last among its new siblings.'
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/category.CategoryResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Update or move a category
      tags:
      - categories
  /documents/{id}:
    delete:
      description: 'Soft delete: the row stays so the audit trail keeps pointing at
        something real.'
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Delete a document
      tags:
      - documents
    get:
      description: Counts the read at most once per hour per reader, and only for
        published documents. The response carries `available_actions` — the lifecycle
        moves this caller may make right now.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Get a document with its content
      tags:
      - documents
    put:
      consumes:
      - application/json
      description: On a document that has ever been published, the content being replaced
        is snapshotted as a new version first — in the same transaction as the write.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Document
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.UpdateDocumentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Update a document
      tags:
      - documents
  /documents/{id}/{action}:
    post:
      consumes:
      - application/json
      description: 'One handler per action, bound in routes/route.go: submit-review,
        approve, reject, publish, unpublish, archive, restore. An illegal move answers
        422 naming both statuses. `reason` is required on reject.'
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Reason, required when rejecting
        in: body
        name: request
        schema:
          $ref: '#/definitions/document.TransitionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Move a document through its lifecycle
      tags:
      - documents
  /documents/{id}/access:
    get:
      description: Empty means the document is unrestricted and ordinary permissions
        apply. Any rows mean it is restricted to the subjects listed (FR-9).
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/document.AccessResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List a document's access grants
      tags:
      - documents
    post:
      consumes:
      - application/json
      description: The first grant narrows the document to whoever is named; it never
        widens one. Holders of documents.access.manage are never locked out.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Grant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.StoreAccessRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.AccessResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Restrict a document to a user or role
      tags:
      - documents
  /documents/{id}/access/{accessId}:
    delete:
      description: Removing the last grant makes the document unrestricted again.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Access grant ID
        in: path
        name: accessId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.HTTPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Revoke one access grant
      tags:
      - documents
  /documents/{id}/attachments:
    get:
      description: Downloadable files only — images embedded in the content are already
        visible there.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/attachment.AttachmentResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List a document's attachments
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data, field `file`. Type is taken from the file's
        own bytes, not the browser's Content-Type header. Answers to the document's
        edit rule.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/attachment.AttachmentResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Attach a file to a document
      tags:
      - attachments
  /documents/{id}/pin:
    patch:
      consumes:
      - application/json
      description: Pinned documents sort first in their space whatever order is chosen.
        Answers to the document's edit rule, and carries no content — flipping the
        flag cannot overwrite someone else's edit.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Pin state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/document.PinDocumentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Pin or unpin a document
      tags:
      - documents
  /documents/{id}/related:
    get:
      description: 'The documents a reader of this one is most likely to want next
        (FR-4): most shared tags first, same category as the tie-breaker. Published
        documents in the same space only, filtered by what this caller may see.'
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/document.DocumentResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Related documents
      tags:
      - documents
  /documents/{id}/tags:
    post:
      consumes:
      - application/json
      description: Takes the whole set by name; a name nobody has used becomes a tag
        (FR-6). Answers to the document's edit rule, not to a tag permission — retagging
        is an edit of the document.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Tag names
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tag.SyncDocumentTagsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/tag.TagResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Replace a document's tags
      tags:
      - documents
  /documents/{id}/undelete:
    post:
      description: 'Comes back as a draft even if it was published when deleted: putting
        content back in front of readers without anyone looking at why it was deleted
        is the one outcome nobody asked for.'
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.DocumentDetailResource'
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: Restore a deleted document
      tags:
      - documents
  /documents/{id}/versions:
    get:
      description: Newest first, without content — the list is a sidebar of numbers
        and notes.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      items:
                        $ref: '#/definitions/document.VersionResource'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.HTTPError'
      security:
      - BearerAuth: []
      summary: List a document's versions
      tags:
      - documents
  /documents/{id}/versions/{versionNumber}:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version number, as shown in the list
        in: path
        name: versionNumber
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.HTTPResponse'
            - properties:
                payload:
                  properties:
                    data:
                      $ref: '#/definitions/document.VersionDetailResource'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
