  notification.Resource:
    properties:
      body:
        type: string
      created_at:
        type: string
      data:
        items:
          type: integer
        type: array
      f_created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  queue.NameCount:
    properties:
      count:
        type: integer
      failed:
        type: integer
      name:
        type: string
      pending:
        type: integer
      running:
        type: integer
      success:
        type: integer
    type: object
  queue.PurgeRequest:
    properties:
      statuses:
        items:
          $ref: '#/definitions/queue.Status'
        minItems: 1
