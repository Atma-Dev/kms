        description: |-
          Debug carries the cause when APP_DEBUG is on. omitempty keeps production
          responses byte identical to what they were before the flag existed.
        type: string
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      message:
        type: string
      payload:
        $ref: '#/definitions/utils.Payload'
      status_code:
        type: integer
      timestamp:
        type: string
    type: object
  utils.HTTPResponse:
    properties:
      code:
        $ref: '#/definitions/enums.ResponseCode'
      message:
        type: string
      payload:
        $ref: '#/definitions/utils.Payload'
      status_code:
        type: integer
      timestamp:
        type: string
    type: object
