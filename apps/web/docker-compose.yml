# Project name pinned: the folder is now apps/web, but the container on the
# server is named after the old repo (web-kms).
name: web-kms

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
        NUXT_PUBLIC_BYPASS_LOGIN: ${NUXT_PUBLIC_BYPASS_LOGIN:-false}
        NUXT_PUBLIC_BYPASS_LOGIN_EMAIL: ${NUXT_PUBLIC_BYPASS_LOGIN_EMAIL:-}
    image: web-kms:latest
    restart: unless-stopped
    ports:
      # pick a free host port on the shared server (api-kms uses 8084) and set
      # it here, or export WEB_PORT before `docker compose up`
      - "127.0.0.1:${WEB_PORT:-8085}:${PORT:-3000}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
