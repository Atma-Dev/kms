name: kms

# Local containers. MySQL and Redis run on the host.
services:
  api:
    build:
      context: ./apps/api
    env_file: ./apps/api/.env
    environment:
      APP_PORT: "8019"
      DB_HOST: host.docker.internal
      JWT_REDIS_HOST: host.docker.internal
    volumes:
      - ./apps/api/.env:/app/.env:ro
      - ./apps/api/storage:/app/storage
    ports:
      - "127.0.0.1:8019:8019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build:
      context: ./apps/web
    env_file: ./apps/web/.env
    environment:
      HOST: 0.0.0.0
      PORT: "3019"
    ports:
      - "127.0.0.1:3019:3019"
    user: node
